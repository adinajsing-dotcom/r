<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Health</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

html,body{
  width:100vw;height:100vh;
  background:#0a0a0a;
  overflow:hidden;
  font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
  touch-action:manipulation;
}

.scr{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:opacity 0.18s,transform 0.18s;
}
.scr.off{opacity:0;pointer-events:none;transform:scale(0.95)}

/* ═══════════════════════
   SCREEN 1 — WATCH FACE
   Camouflage: looks like
   a real watch / fitness
   display
═══════════════════════ */
#s1{ background:#000; padding:0; }

/* Outer watch face circle */
.watch-face{
  width:220px;height:220px;
  border-radius:50%;
  background:radial-gradient(ellipse at 40% 35%, #1c1c1e 0%, #0a0a0a 100%);
  border:1px solid #2a2a2a;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;
  box-shadow:0 0 0 1px #111, inset 0 1px 0 rgba(255,255,255,0.04);
}

/* Fake time top */
.wf-time{
  font-size:13px;font-weight:300;
  color:#555;letter-spacing:0.06em;
  margin-bottom:4px;
}

/* Fake date */
.wf-date{
  font-size:10px;color:#333;
  letter-spacing:0.1em;text-transform:uppercase;
  margin-bottom:14px;
}

/* BPM label */
.wf-bpm-lbl{
  font-size:9px;color:#444;
  letter-spacing:0.18em;text-transform:uppercase;
  margin-bottom:2px;
}

/* The BIG number — this is our input dial disguised as BPM */
.wf-bpm{
  font-size:56px;font-weight:200;
  color:#e8e8e8;
  line-height:1;
  letter-spacing:-2px;
  font-variant-numeric:tabular-nums;
}

/* bpm unit */
.wf-unit{
  font-size:10px;color:#444;
  letter-spacing:0.14em;text-transform:uppercase;
  margin-top:2px;margin-bottom:10px;
}

/* Fake activity rings around the edge */
.ring-wrap{
  position:absolute;inset:8px;border-radius:50%;
}
.ring-svg{width:100%;height:100%}

/* ‹ › tap zones — invisible but large */
.tap-l{
  position:absolute;left:0;top:0;bottom:0;width:50%;
  display:flex;align-items:center;justify-content:flex-start;
  padding-left:10px;
  cursor:pointer;
}
.tap-r{
  position:absolute;right:0;top:0;bottom:0;width:50%;
  display:flex;align-items:center;justify-content:flex-end;
  padding-right:10px;
  cursor:pointer;
}
.tap-arrow{
  font-size:20px;color:#2a2a2a;line-height:1;
}

/* LOG button — looks like a small pill on a watch */
.log-btn{
  margin-top:8px;
  width:70px;height:26px;border-radius:13px;
  border:1px solid #2a2a2a;background:transparent;
  color:#3a3a3a;font-size:10px;
  letter-spacing:0.1em;text-transform:uppercase;
  cursor:pointer;
}
.log-btn:active{background:#111;color:#666}

/* Fake steps / cal row */
.wf-stats{
  margin-top:10px;
  display:flex;gap:16px;
}
.wf-stat{text-align:center}
.wf-stat-val{font-size:12px;font-weight:400;color:#3a3a3a}
.wf-stat-lbl{font-size:8px;color:#282828;letter-spacing:0.1em;text-transform:uppercase}

/* ═══════════════════════════════
   SCREEN 2 — CENTRED RESULTS
   Compact, clear, perfectly
   centred on the round watch
═══════════════════════════════ */
#s2{
  background:#000;
  padding:0;
  align-items:center;
  justify-content:center;
}

/* Inner container — centred block */
.s2-inner{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
  padding:0 16px;
  gap:0;
}

/* Tiny BPM label at top — camouflage */
.s2-bpm-row{
  display:flex;align-items:baseline;gap:5px;
  margin-bottom:10px;
}
.s2-bpm-val{
  font-size:22px;font-weight:200;color:#555;
  letter-spacing:-1px;font-variant-numeric:tabular-nums;
}
.s2-bpm-unit{
  font-size:9px;color:#2a2a2a;letter-spacing:0.14em;text-transform:uppercase;
}

/* Thin separator */
.s2-sep{
  width:60px;height:1px;background:#181818;margin-bottom:10px;
}

/* THE GRID — 3 rows of 6 + last row centred */
.num-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:5px 3px;
  width:100%;
}
.nn{
  height:28px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:300;
  color:#aaa;
  border-radius:3px;
}
/* predicted centre — clearly highlighted */
.nn.ctr{
  color:#fff;
  font-weight:500;
  background:#1e1e1e;
  border-radius:3px;
}
/* last lone number — span middle 2 columns */
.nn.lone{
  grid-column:3/5;
  font-size:17px;
}

/* Thin separator below grid */
.s2-sep2{
  width:60px;height:1px;background:#181818;margin-top:10px;margin-bottom:6px;
}

/* Tap hint */
.return-hint{
  font-size:9px;color:#222;
  letter-spacing:0.12em;text-transform:uppercase;
  text-align:center;
}

/* Fake sparkline hidden inside — tiny decoration */
.spark{display:none}
</style>
</head>
<body>

<!-- ── SCREEN 1: WATCH FACE DIAL ── -->
<div class="scr" id="s1">
  <div class="watch-face">

    <!-- Fake activity ring SVG -->
    <svg class="ring-svg" style="position:absolute;inset:0" viewBox="0 0 204 204">
      <!-- move ring -->
      <circle cx="102" cy="102" r="96" fill="none" stroke="#1a1a1a" stroke-width="3"/>
      <circle cx="102" cy="102" r="96" fill="none" stroke="#3a1a1a" stroke-width="3"
        stroke-dasharray="420 603" stroke-dashoffset="150" stroke-linecap="round"/>
      <!-- exercise ring -->
      <circle cx="102" cy="102" r="88" fill="none" stroke="#1a1a1a" stroke-width="3"/>
      <circle cx="102" cy="102" r="88" fill="none" stroke="#1a2e1a" stroke-width="3"
        stroke-dasharray="280 553" stroke-dashoffset="140" stroke-linecap="round"/>
      <!-- stand ring -->
      <circle cx="102" cy="102" r="80" fill="none" stroke="#1a1a1a" stroke-width="3"/>
      <circle cx="102" cy="102" r="80" fill="none" stroke="#1a2a3a" stroke-width="3"
        stroke-dasharray="350 503" stroke-dashoffset="125" stroke-linecap="round"/>
    </svg>

    <!-- Fake time -->
    <div class="wf-time" id="wfTime">10:24</div>
    <div class="wf-date" id="wfDate">Wed 11 Jun</div>

    <!-- BPM label -->
    <div class="wf-bpm-lbl">bpm</div>
    <!-- THE DIAL NUMBER -->
    <div class="wf-bpm" id="dialNum">72</div>
    <div class="wf-unit">resting</div>

    <!-- Invisible tap zones L / R -->
    <div class="tap-l" id="tapL"><span class="tap-arrow">‹</span></div>
    <div class="tap-r" id="tapR"><span class="tap-arrow">›</span></div>

  </div>

  <!-- LOG button below the watch face -->
  <button class="log-btn" onclick="showSector()">log</button>

  <!-- fake steps / cals -->
  <div class="wf-stats">
    <div class="wf-stat">
      <div class="wf-stat-val" id="fSteps">6,240</div>
      <div class="wf-stat-lbl">steps</div>
    </div>
    <div class="wf-stat">
      <div class="wf-stat-val" id="fCal">312</div>
      <div class="wf-stat-lbl">kcal</div>
    </div>
    <div class="wf-stat">
      <div class="wf-stat-val">7h 42m</div>
      <div class="wf-stat-lbl">sleep</div>
    </div>
  </div>

</div>

<!-- ── SCREEN 2: 19 NUMBERS — CENTRED ── -->
<div class="scr off" id="s2">
  <div class="s2-inner">

    <!-- Fake BPM top — camouflage -->
    <div class="s2-bpm-row">
      <div class="s2-bpm-val" id="s2BigNum">72</div>
      <div class="s2-bpm-unit">bpm</div>
    </div>

    <div class="s2-sep"></div>

    <!-- 19 numbers: 3×6 + 1 -->
    <div class="num-grid" id="numGrid"></div>

    <div class="s2-sep2"></div>
    <div class="return-hint">tap to return</div>
    <div class="spark" id="spark"></div>

  </div>
</div>

<script>
const WHEEL=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
function getSector(c){
  const i=WHEEL.indexOf(c);
  return[...new Set(Array.from({length:19},(_,k)=>WHEEL[((i-9+k+37)%37)]))].sort((a,b)=>a-b);
}

/* live time */
function setTime(){
  const d=new Date();
  const h=d.getHours(),m=d.getMinutes();
  document.getElementById('wfTime').textContent=h+':'+(m<10?'0':'')+m;
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('wfDate').textContent=days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()];
}
setTime();setInterval(setTime,30000);

/* fake steps / cals drift to look live */
setInterval(()=>{
  const s=parseInt(document.getElementById('fSteps').textContent.replace(',',''));
  document.getElementById('fSteps').textContent=(s+Math.floor(Math.random()*3)).toLocaleString();
  const c=parseInt(document.getElementById('fCal').textContent);
  if(Math.random()>0.6) document.getElementById('fCal').textContent=(c+1);
},8000);

/* BPM starts in 60-85 range (realistic heart rate) */
/* We map: actual roulette 0-36 → displayed as 60-96 (60+n) */
/* So user sees a normal BPM, internally we track 0-36 */
let cur=Math.floor(Math.random()*20)+10; // start somewhere 10-30 (shows as 70-90 bpm)
const dialEl=document.getElementById('dialNum');
function display(n){ dialEl.textContent=60+n; } // offset by 60 so it looks like BPM
display(cur);

function change(d){
  cur=((cur+d)+37)%37;
  display(cur);
}

/* hold-to-scroll */
let pt=null;
function ps(d){change(d);pt=setInterval(()=>change(d),90);}
function pe(){clearInterval(pt);}

const tL=document.getElementById('tapL');
const tR=document.getElementById('tapR');
tL.addEventListener('touchstart',e=>{e.preventDefault();ps(-1);},{passive:false});
tL.addEventListener('touchend',pe);
tL.addEventListener('mousedown',()=>ps(-1));
tL.addEventListener('mouseup',pe);
tR.addEventListener('touchstart',e=>{e.preventDefault();ps(1);},{passive:false});
tR.addEventListener('touchend',pe);
tR.addEventListener('mousedown',()=>ps(1));
tR.addEventListener('mouseup',pe);

function showSector(){
  const sector=getSector(cur);
  document.getElementById('s2BigNum').textContent=60+cur;

  const g=document.getElementById('numGrid');
  g.innerHTML='';
  sector.forEach((n,idx)=>{
    const d=document.createElement('div');
    const isLast=(idx===18);
    d.className='nn'+(n===cur?' ctr':'')+(isLast?' lone':'');
    d.textContent=n;
    g.appendChild(d);
  });

  document.getElementById('s1').classList.add('off');
  document.getElementById('s2').classList.remove('off');
}

function goBack(){
  document.getElementById('s2').classList.add('off');
  document.getElementById('s1').classList.remove('off');
}

/* tap anywhere on s2 to return */
document.getElementById('s2').addEventListener('click',goBack);

/* swipe right = back */
let sx=0;
document.getElementById('s2').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
document.getElementById('s2').addEventListener('touchend',e=>{
  if(e.changedTouches[0].clientX-sx>50) goBack();
},{passive:true});

/* desktop keyboard */
document.addEventListener('keydown',e=>{
  const onDial=!document.getElementById('s1').classList.contains('off');
  if(onDial){
    if(e.key==='ArrowLeft')change(-1);
    if(e.key==='ArrowRight')change(1);
    if(e.key==='Enter')showSector();
  } else {
    if(e.key==='Backspace'||e.key==='ArrowLeft') goBack();
  }
});
</script>
</body>
</html>
