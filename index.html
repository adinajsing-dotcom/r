<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Health</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

html,body{
  width:100vw;height:100vh;
  background:#000;
  overflow:hidden;
  font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
  touch-action:manipulation;
}

/* ── SCREENS ── */
.scr{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:opacity 0.15s,transform 0.15s;
}
.scr.off{opacity:0;pointer-events:none;transform:scale(0.96)}

/* ══════════════════════════════
   SCREEN 1 — CAMOUFLAGE DIAL
   Looks like a health / fitness
   metric selector
══════════════════════════════ */
#s1{
  background:#000;
  gap:0;
  padding:22px 18px;
}

/* Fake "activity rings" — top decoration */
.fake-rings{
  display:flex;gap:6px;align-items:center;
  margin-bottom:14px;
}
.ring{
  border-radius:50%;border-style:solid;
}
.ring-a{width:14px;height:14px;border-width:2px;border-color:#1a1a1a}
.ring-b{width:10px;height:10px;border-width:2px;border-color:#151515}
.ring-c{width:7px;height:7px;border-width:2px;border-color:#121212}

/* Tiny label above dial — looks like "BPM" or "STEPS" */
.dial-lbl{
  font-size:9px;letter-spacing:0.22em;text-transform:uppercase;
  color:#1e1e1e;margin-bottom:10px;
}

/* The main number dial */
.dial{
  display:flex;align-items:center;
  gap:2px;
}
.d-btn{
  width:52px;height:64px;
  border:none;background:transparent;
  color:#1c1c1c;font-size:30px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;
  touch-action:manipulation;
}
.d-btn:active{color:#333;background:#080808}

.d-num{
  width:88px;text-align:center;
  font-size:64px;font-weight:200;
  color:#2a2a2a;
  line-height:1;
  font-variant-numeric:tabular-nums;
  letter-spacing:-3px;
}

/* Fake unit label below number */
.dial-unit{
  font-size:8px;color:#111;letter-spacing:0.18em;
  text-transform:uppercase;margin-top:6px;
}

/* Go trigger — looks like a "log" or "save" button */
.go-btn{
  margin-top:16px;
  width:88px;height:30px;border-radius:15px;
  border:1px solid #151515;background:transparent;
  color:#1c1c1c;font-size:10px;letter-spacing:0.14em;
  text-transform:uppercase;cursor:pointer;
}
.go-btn:active{background:#080808;color:#333}

/* Fake bottom bar — decorative only */
.fake-bar{
  margin-top:14px;
  display:flex;gap:4px;align-items:flex-end;
  height:12px;
}
.bar-seg{
  width:4px;border-radius:1px;background:#0d0d0d;
}

/* ══════════════════════════════
   SCREEN 2 — 19 NUMBERS
   3 rows of 6 + 1 row of 1
   Ultra-discrete
══════════════════════════════ */
#s2{
  background:#000;
  padding:16px 14px 12px;
  justify-content:flex-start;
}

/* Fake header — looks like a metric detail view */
.s2-hdr{
  display:flex;align-items:center;
  width:100%;margin-bottom:10px;
  justify-content:space-between;
}
.fake-back{
  font-size:10px;color:#151515;
  letter-spacing:0.1em;text-transform:uppercase;
}
.fake-title{
  font-size:9px;color:#111;
  letter-spacing:0.16em;text-transform:uppercase;
  flex:1;text-align:center;
}
.fake-more{font-size:10px;color:#111}

/* The grid — looks like a stats breakdown table */
.num-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:3px 4px;
  width:100%;
}
.cell{
  height:26px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:300;
  color:#1e1e1e;
  letter-spacing:0;
}
/* predicted centre — one tick brighter */
.cell.ctr{color:#2e2e2e;font-weight:400}

/* Fake sparkline below grid */
.fake-spark{
  margin-top:10px;width:100%;
  display:flex;gap:2px;align-items:flex-end;height:10px;
}
.spark-bar{
  flex:1;border-radius:1px;background:#0a0a0a;
}

/* Back tap area — whole screen tappable to go back */
.tap-back{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  font-size:8px;color:#0e0e0e;letter-spacing:0.12em;text-transform:uppercase;
}
</style>
</head>
<body>

<!-- ── SCREEN 1: DIAL ── -->
<div class="scr" id="s1">

  <!-- fake activity rings top -->
  <div class="fake-rings">
    <div class="ring ring-a"></div>
    <div class="ring ring-b"></div>
    <div class="ring ring-c"></div>
  </div>

  <div class="dial-lbl">bpm avg</div>

  <div class="dial">
    <button class="d-btn" id="btnL">‹</button>
    <div class="d-num" id="dialNum">0</div>
    <button class="d-btn" id="btnR">›</button>
  </div>
  <div class="dial-unit">resting</div>

  <button class="go-btn" onclick="showSector()">log</button>

  <!-- fake bar chart decoration -->
  <div class="fake-bar">
    <div class="bar-seg" style="height:4px"></div>
    <div class="bar-seg" style="height:7px"></div>
    <div class="bar-seg" style="height:5px"></div>
    <div class="bar-seg" style="height:10px"></div>
    <div class="bar-seg" style="height:6px"></div>
    <div class="bar-seg" style="height:8px"></div>
    <div class="bar-seg" style="height:4px"></div>
    <div class="bar-seg" style="height:9px"></div>
    <div class="bar-seg" style="height:5px"></div>
    <div class="bar-seg" style="height:7px"></div>
    <div class="bar-seg" style="height:3px"></div>
    <div class="bar-seg" style="height:6px"></div>
  </div>

</div>

<!-- ── SCREEN 2: 19 NUMBERS ── -->
<div class="scr off" id="s2">

  <div class="s2-hdr">
    <div class="fake-back">‹ back</div>
    <div class="fake-title">weekly avg</div>
    <div class="fake-more">···</div>
  </div>

  <div class="num-grid" id="numGrid"></div>

  <!-- fake sparkline -->
  <div class="fake-spark" id="spark"></div>

  <div class="tap-back">tap to return</div>

</div>

<script>
const WHEEL=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
function getSector(c){
  const i=WHEEL.indexOf(c);
  return[...new Set(Array.from({length:19},(_,k)=>WHEEL[((i-9+k+37)%37)]))].sort((a,b)=>a-b);
}

let cur=0;
const dialEl=document.getElementById('dialNum');

function change(d){cur=((cur+d)+37)%37;dialEl.textContent=cur;}

/* hold-to-scroll */
let pt=null;
function ps(d){change(d);pt=setInterval(()=>change(d),100);}
function pe(){clearInterval(pt);}

const btnL=document.getElementById('btnL');
const btnR=document.getElementById('btnR');
btnL.addEventListener('touchstart',e=>{e.preventDefault();ps(-1);},{passive:false});
btnL.addEventListener('touchend',pe);
btnL.addEventListener('mousedown',()=>ps(-1));
btnL.addEventListener('mouseup',pe);
btnR.addEventListener('touchstart',e=>{e.preventDefault();ps(1);},{passive:false});
btnR.addEventListener('touchend',pe);
btnR.addEventListener('mousedown',()=>ps(1));
btnR.addEventListener('mouseup',pe);

function showSector(){
  const sector=getSector(cur);
  const g=document.getElementById('numGrid');
  g.innerHTML='';
  sector.forEach(n=>{
    const d=document.createElement('div');
    d.className='cell'+(n===cur?' ctr':'');
    d.textContent=n;
    g.appendChild(d);
  });
  /* fake sparkline randomised */
  const sp=document.getElementById('spark');
  sp.innerHTML='';
  for(let i=0;i<20;i++){
    const b=document.createElement('div');
    b.className='spark-bar';
    b.style.height=(3+Math.floor(Math.random()*7))+'px';
    sp.appendChild(b);
  }
  document.getElementById('s1').classList.add('off');
  document.getElementById('s2').classList.remove('off');
}

/* tap anywhere on s2 to go back */
document.getElementById('s2').addEventListener('click',()=>{
  document.getElementById('s2').classList.add('off');
  document.getElementById('s1').classList.remove('off');
});

/* swipe right on s2 = back */
let sx=0;
document.getElementById('s2').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
document.getElementById('s2').addEventListener('touchend',e=>{
  if(e.changedTouches[0].clientX-sx>50){
    document.getElementById('s2').classList.add('off');
    document.getElementById('s1').classList.remove('off');
  }
},{passive:true});

/* keyboard for desktop preview */
document.addEventListener('keydown',e=>{
  const onDial=!document.getElementById('s1').classList.contains('off');
  if(onDial){
    if(e.key==='ArrowLeft')change(-1);
    if(e.key==='ArrowRight')change(1);
    if(e.key==='Enter')showSector();
  } else {
    if(e.key==='Backspace'||e.key==='ArrowLeft'){
      document.getElementById('s2').classList.add('off');
      document.getElementById('s1').classList.remove('off');
    }
  }
});
</script>
</body>
</html>
